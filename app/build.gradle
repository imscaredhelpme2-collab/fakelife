plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fakelife'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.fakelife'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
// No third-party dependencies on purpose: plain Android framework only.
